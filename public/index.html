<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outside Cue</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><strong>Outside Cue</strong><span id="status">Connecting...</span></header>
<main><section id="setup"><p class="eyebrow">A LITTLE TIME OUTSIDE</p><h1>What will you notice?</h1><form id="planner"><label for="wish">Today, I'm curious about</label><textarea id="wish" maxlength="300" required placeholder="The shapes of buildings, the sound of leaves..."></textarea><div class="options"><label>Setting<select id="place"><option value="any">Any outdoor place</option><option value="street">A public street</option><option value="park">A park or garden</option></select></label><fieldset><legend>Minutes</legend><label><input type="radio" name="minutes" value="5" checked>5</label><label><input type="radio" name="minutes" value="10">10</label><label><input type="radio" name="minutes" value="15">15</label></fieldset></div><button id="make" type="submit">Find my cues <span aria-hidden="true">&#8594;</span></button><p id="error" role="alert"></p></form></section>
<section id="result" hidden><div class="result-heading"><p class="eyebrow">YOUR OUTSIDE BREAK</p><button id="back" type="button" title="Change your preferences" aria-label="Back to preferences">&#8592;</button></div><h1 id="plan-title"></h1><ol id="cues"></ol><p id="note"></p><div class="actions"><button id="begin" type="button">Start break</button><button id="print" type="button" title="Print cues">Print</button></div><p id="evidence"></p></section>
<section id="break" hidden><p class="eyebrow">TIME AWAY</p><h1>Look up. Take your time.</h1><p id="break-cue"></p><p id="timer" role="timer"></p><button id="finish" type="button">Finish break</button></section>
<section id="done" hidden><p class="eyebrow">BACK WHEN YOU'RE READY</p><h1>What did you notice?</h1><label for="reflection">One detail to remember</label><textarea id="reflection" maxlength="500" placeholder="Optional. This disappears when you close the page."></textarea><button id="again" type="button">Another break</button></section>
<footer>Local AI &#183; No account &#183; No location tracking</footer></main></body></html>
